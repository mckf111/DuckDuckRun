<script>
'use strict';
/* ================= 基础 ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 960, H = 540, CX = W / 2, HOR = H * 0.40;   // 逻辑分辨率与地平线
const CAMF = 300, CAMH = 2.3, ZP = 3, DRAWD = 72;      // 透视参数:焦距/相机高/玩家z/绘制距离
const LANEGAP = 1.25, ROAD_HALF = 2.0;

function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

// 透视投影:世界(车道x, 高度y, 相对深度z) -> 屏幕
function proj(x, y, z){
  const s = CAMF / z;
  return { x: CX + x * s, y: HOR + (CAMH - y) * s, s };
}
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;
const rnd = (a,b)=>a+Math.random()*(b-a);
const irnd = (a,b)=>Math.floor(rnd(a,b+1));
const TAU = Math.PI*2;

/* ================= 存档 ================= */
const SAVE_KEY = 'jinling_run_v1';
const save = (()=>{ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; }catch(e){ return {}; } })();
save.best   = save.best   || 0;          // 无尽最高分(米)
save.stars  = save.stars  || [0,0,0,0,0];// 每关星级
save.album  = save.album  || {};         // 图鉴 {id:true}
save.muted  = !!save.muted;
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

/* ================= 音频(WebAudio 合成) ================= */
let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type, vol, delay){
  if(save.muted) return; const a = ac(); if(!a) return;
  const t0 = a.currentTime + (delay||0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(f0, t0);
  if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t0+dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol||0.15, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}
const sfx = {
  jump(){ tone(300, 620, 0.18, 'triangle', 0.12); },
  slide(){ tone(500, 180, 0.2, 'sawtooth', 0.05); },
  lane(){ tone(420, 500, 0.08, 'square', 0.05); },
  collect(){ // 五声音阶拨弦
    const p = [523,587,659,784,880]; const f = p[irnd(0,4)];
    tone(f, f, 0.25, 'sine', 0.14); tone(f*2, f*2, 0.18, 'sine', 0.05);
  },
  hit(){ tone(160, 40, 0.4, 'sawtooth', 0.2); tone(90, 30, 0.5, 'square', 0.12, 0.03); },
  clear(){ [523,659,784,1047].forEach((f,i)=>tone(f,f,0.3,'triangle',0.13,i*0.12)); },
  click(){ tone(700, 700, 0.06, 'square', 0.06); },
};

/* ================= 输入 ================= */
const keys = {};
addEventListener('keydown', e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  if(!e.repeat){
    const k = e.key;
    if(k==='ArrowLeft'||k==='a') onLeft();
    else if(k==='ArrowRight'||k==='d') onRight();
    else if(k==='ArrowUp'||k===' '||k==='w') onJump();
    else if(k==='ArrowDown'||k==='s') onSlide();
    else if(k==='p'||k==='P'||k==='Escape') onPauseKey();
    else if(k==='m'||k==='M'){ save.muted=!save.muted; persist(); }
    else if(k==='Enter') onEnter();
  }
  keys[e.key]=true;
});
addEventListener('keyup', e=>{ keys[e.key]=false; });

// 触屏/鼠标:滑动 = 操作;点击 = 按钮
let tStart = null;
cv.addEventListener('pointerdown', e=>{ ac(); tStart = {x:e.clientX, y:e.clientY}; });
cv.addEventListener('pointerup', e=>{
  if(!tStart) return;
  const dx = e.clientX - tStart.x, dy = e.clientY - tStart.y;
  tStart = null;
  if(Math.hypot(dx,dy) > 24){ // 滑动
    if(Math.abs(dx) > Math.abs(dy)) (dx>0?onRight():onLeft());
    else (dy<0?onJump():onSlide());
  } else { // 点击 -> 屏幕坐标命中按钮
    const r = cv.getBoundingClientRect();
    const px = (e.clientX-r.left)/r.width*W, py = (e.clientY-r.top)/r.height*H;
    clickAt(px, py);
  }
});
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && G.state==='play') G.paused=true; });

/* ================= 关卡主题(国风剪纸配色) ================= */
// 每关:天空渐变/地面/车道线/两侧装饰/强调色/障碍母题
const LEVELS = [
  { name:'明城墙', sub:'六百年城砖,从台城跑到中华门',
    sky:['#16222e','#3a5468'], ground:'#7d3a32', road:'#93504a', lane:'#e8d9b0',
    side:'#4a2c28', sideTop:'#5d3833', accent:'#e8b04b', motif:'crenel',
    hud:'#f3e6c8', textDark:false, speed:9.5, len:520,

  { name:'中山陵', sub:'三百九十二级台阶,一口气跑上去',

    hud:'#274a6b', textDark:true, speed:11, len:600,
    side2:'雪松', weight:{low:.62,high:.18,full:.2} },
  { name:'夫子庙 · 秦淮河', sub:'桨声灯影,十里珠帘',
    sky:['#0c0918','#2b1a3d'], ground:'#191226', road:'#241a35', lane:'#f0b64c',
    side:'#120d1e', sideTop:'#1a1228', accent:'#e2483d', motif:'lantern',
    hud:'#f7d9a0', textDark:false, speed:11.5, len:640,
    side2:'画舫', weight:{low:.4,high:.35,full:.25} },
  { name:'紫金山', sub:'夜奔紫金山巅,终点看金陵灯火',
    sky:['#100e24','#3a2a66'], ground:'#221c3d', road:'#2c2450', lane:'#b9a8e8',
    side:'#181331', sideTop:'#201a40', accent:'#c9a2ff', motif:'pine',
    hud:'#e6dcff', textDark:false, speed:12, len:700,
    side2:'星空', weight:{low:.42,high:.3,full:.28} },
];

/* 收集品图鉴(剪纸图标 + 民俗小注) */
const ITEMS = [
  { id:'duck',  name:'盐水鸭',   note:'桂花鸭最负盛名,皮白肉嫩,金陵第一味' },
  { id:'fans',  name:'鸭血粉丝汤', note:'鸭血滑嫩粉丝爽口,南京人的一碗乡愁' },
  { id:'tea',   name:'雨花茶',   note:'形如松针,绿意清雅,全国十大名茶之一' },
  { id:'taro',  name:'桂花糖芋苗', note:'红糖熬芋苗,桂花香里软糯拉丝' },
  { id:'plum',  name:'梅花',     note:'南京市花,梅花山上凌寒独放' },
  { id:'stone', name:'雨花石',   note:'天赐国宝,一枚石子一山水' },
];

/* ================= 剪纸绘制:小件 ================= */
function poly(pts, fill, stroke, lw){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.5; ctx.stroke(); }
}
function disc(x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1.5; ctx.stroke(); }
}
function petalFlower(x,y,r,fill,center){
  for(let i=0;i<5;i++){
    const a = -Math.PI/2 + i*TAU/5;
    ctx.beginPath();
    ctx.ellipse(x+Math.cos(a)*r*0.62, y+Math.sin(a)*r*0.62, r*0.55, r*0.34, a, 0, TAU);
    ctx.fillStyle=fill; ctx.fill();
  }
  disc(x,y,r*0.3,center||'#f0b64c');
}

/* 图鉴图标:以 (x,y) 为中心,r 为半径 */
function drawItemIcon(id, x, y, r, locked){
  const main = locked ? '#3a3344' : '#e2483d';
  const lite = locked ? '#2c2735' : '#f0b64c';
  ctx.save(); ctx.translate(x,y);
  if(id==='duck'){ // 盐水鸭剪影
    ctx.fillStyle=main;
    ctx.beginPath(); ctx.ellipse(0,r*0.15,r*0.85,r*0.5,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.55,-r*0.35,r*0.3,0,TAU); ctx.fill();
    poly([[r*0.78,-r*0.4],[r*1.05,-r*0.3],[r*0.78,-r*0.22]], main);
    if(!locked) disc(r*0.62,-r*0.42,r*0.05,'#fff');
    poly([[-r*0.7,-r*0.15],[-r*1.05,-r*0.45],[-r*0.85,0]], main);
  } else if(id==='fans'){ // 一碗粉丝汤
    ctx.fillStyle=main;
    ctx.beginPath(); ctx.arc(0,0,r*0.8,0,Math.PI); ctx.closePath(); ctx.fill();
    poly([[-r*0.9,0],[r*0.9,0],[r*0.8,0],[ -r*0.8,0]], main);
    ctx.strokeStyle=lite; ctx.lineWidth=r*0.09;
    for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(i*r*0.3,-r*0.05);
      ctx.quadraticCurveTo(i*r*0.3+r*0.12,-r*0.5,i*r*0.25,-r*0.8); ctx.stroke(); }
    disc(r*0.45,-r*0.15,r*0.12,lite);
  } else if(id==='tea'){ // 雨花茶盏
    poly([[-r*0.6,-r*0.2],[r*0.6,-r*0.2],[r*0.4,r*0.5],[-r*0.4,r*0.5]], main);
    poly([[-r*0.3,r*0.55],[r*0.3,r*0.55],[r*0.35,r*0.7],[-r*0.35,r*0.7]], main);
    ctx.strokeStyle=lite; ctx.lineWidth=r*0.08;
    for(let i=0;i<3;i++){ const px=(i-1)*r*0.28;
      ctx.beginPath(); ctx.moveTo(px,-r*0.3);
      ctx.quadraticCurveTo(px+r*0.1,-r*0.6,px,-r*0.9); ctx.stroke(); }
  } else if(id==='taro'){ // 糖芋苗
    ctx.fillStyle=main;
    ctx.beginPath(); ctx.arc(0,0,r*0.75,0,Math.PI); ctx.closePath(); ctx.fill();
    for(let i=0;i<3;i++) disc((i-1)*r*0.35,-r*0.12,r*0.17, lite);
    petalFlower(r*0.45,-r*0.5,r*0.22, locked?'#3a3344':'#f3d9a0');
  } else if(id==='plum'){ // 梅花
    petalFlower(0,0,r*0.85, main, lite);
  } else { // 雨花石
    ctx.fillStyle=main;
    ctx.beginPath(); ctx.ellipse(0,0,r*0.8,r*0.6,0.4,0,TAU); ctx.fill();
    ctx.strokeStyle=lite; ctx.lineWidth=r*0.08;
    ctx.beginPath(); ctx.ellipse(0,0,r*0.5,r*0.35,0.4,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,0,r*0.22,r*0.14,0.4,0,TAU); ctx.stroke();
  }
  ctx.restore();
}

/* ================= 剪纸绘制:障碍 ================= */
// 三类:low(跳过)/high(滑铲钻过)/full(必须换道)
// 在世界投影坐标下绘制:px,py 为地面接触点屏幕坐标,s 为该深度缩放
function drawObstacle(ob, lv){
  const p = proj(ob.x, 0, ob.rz);
  const s = p.s, x = p.x, y = p.y;
  const body = lv.textDark ? '#4a5d75' : '#0f0d18';   // 障碍主体剪影色
  const trim = lv.accent;
  if(ob.type==='low'){          // 地面矮障碍(石狮子/城砖/缆桩/台阶)
    const w = 0.95*s, h = 0.78*s;
    poly([[x-w/2,y],[x-w/2,y-h*0.75],[x-w*0.3,y-h],[x+w*0.3,y-h],[x+w/2,y-h*0.75],[x+w/2,y]], body);
    ctx.strokeStyle=trim; ctx.lineWidth=Math.max(1.5,s*0.02);
    ctx.beginPath(); ctx.moveTo(x-w*0.3,y-h); ctx.lineTo(x+w*0.3,y-h); ctx.stroke();
    // 母题纹样
    if(lv.motif==='crenel'){ // 石狮子面纹
      disc(x, y-h*0.55, 0.16*s, trim);
      disc(x-0.05*s, y-h*0.58, 0.03*s, body); disc(x+0.05*s, y-h*0.58, 0.03*s, body);
    } else if(lv.motif==='lotus'){ // 荷叶卷边
      ctx.strokeStyle=trim; ctx.lineWidth=Math.max(1.5,s*0.025);
      ctx.beginPath(); ctx.arc(x, y-h*0.5, 0.2*s, Math.PI, TAU); ctx.stroke();
    } else if(lv.motif==='steps'){ // 台阶线
      ctx.strokeStyle=trim; ctx.lineWidth=Math.max(1,s*0.018);
      for(let i=1;i<=2;i++){ ctx.beginPath(); ctx.moveTo(x-w/2+2, y-h*i/3); ctx.lineTo(x+w/2-2, y-h*i/3); ctx.stroke(); }
    } else if(lv.motif==='lantern'){ // 灯影纹
      disc(x, y-h*0.5, 0.14*s, null, trim, Math.max(1.5,s*0.02));
    } else { // 松针
      poly([[x,y-h*0.75],[x-0.14*s,y-h*0.4],[x+0.14*s,y-h*0.4]], trim);
    }
  } else if(ob.type==='high'){  // 悬空障碍(灯笼架/横杆),底部留空可滑铲
    const w = 1.0*s, top = 2.1*s, bot = 0.9*s;
    ctx.fillStyle = body;
    ctx.fillRect(x-w/2, y-top, w*0.08, top);          // 左柱
    ctx.fillRect(x+w/2-w*0.08, y-top, w*0.08, top);   // 右柱
    ctx.fillRect(x-w/2, y-top, w, top-bot);           // 横梁体
    ctx.strokeStyle=trim; ctx.lineWidth=Math.max(1.5,s*0.02);
    ctx.strokeRect(x-w/2, y-top, w, top-bot);
    // 挂饰
    for(let i=-1;i<=1;i++){
      const hx = x + i*w*0.28;
      ctx.strokeStyle=trim; ctx.beginPath(); ctx.moveTo(hx, y-bot); ctx.lineTo(hx, y-bot+0.14*s); ctx.stroke();
      if(lv.motif==='lantern'||lv.motif==='crenel'){
        disc(hx, y-bot+0.3*s, 0.13*s, lv.motif==='lantern'?'#e2483d':trim);
        if(lv.motif==='lantern'){ ctx.fillStyle='rgba(240,182,76,0.35)'; ctx.beginPath(); ctx.arc(hx, y-bot+0.3*s, 0.24*s, 0, TAU); ctx.fill(); }
      } else {
        poly([[hx, y-bot+0.14*s],[hx-0.1*s, y-bot+0.4*s],[hx+0.1*s, y-bot+0.4*s]], trim);
      }
    }
  } else {                       // 全车道高障碍(砖墙/画舫/大树),必须换道
    const w = 1.05*s, h = 2.3*s;
    poly([[x-w/2,y],[x-w/2,y-h],[x+w/2,y-h],[x+w/2,y]], body);
    ctx.strokeStyle=trim; ctx.lineWidth=Math.max(1.5,s*0.02);
    ctx.strokeRect(x-w/2, y-h, w, h);
    if(lv.motif==='crenel'){     // 城垛口
      ctx.fillStyle=trim;
      for(let i=0;i<3;i++) ctx.fillRect(x-w/2+w*0.1+i*w*0.36, y-h-0.12*s, w*0.16, 0.12*s);
    } else if(lv.motif==='lotus'){ // 荷花
      petalFlower(x, y-h*0.55, 0.22*s, trim, body);
    } else if(lv.motif==='steps'){ // 牌坊门
      ctx.strokeStyle=trim; ctx.lineWidth=Math.max(1.5,s*0.025);
      ctx.beginPath(); ctx.moveTo(x-w*0.28,y); ctx.lineTo(x-w*0.28,y-h*0.55); ctx.lineTo(x+w*0.28,y-h*0.55); ctx.lineTo(x+w*0.28,y); ctx.stroke();
    } else if(lv.motif==='lantern'){ // 大灯笼墙
      disc(x, y-h*0.6, 0.32*s, '#e2483d');
      ctx.fillStyle='rgba(240,182,76,0.4)'; ctx.beginPath(); ctx.arc(x, y-h*0.6, 0.5*s, 0, TAU); ctx.fill();
      poly([[x-0.1*s,y-h*0.28],[x+0.1*s,y-h*0.28],[x,y-h*0.12]], trim);
    } else {                   // 大树
      poly([[x,y-h],[x-0.3*s,y-h*0.55],[x+0.3*s,y-h*0.55]], trim);
      poly([[x,y-h*0.75],[x-0.38*s,y-h*0.3],[x+0.38*s,y-h*0.3]], trim);
    }
  }
}

/* ================= 剪纸绘制:两侧走廊装饰 ================= */
function drawSide(motif, x, y, s, lv, mirror){
  const m = mirror ? -1 : 1;
  const c = lv.side, t = lv.sideTop, a = lv.accent;
  if(motif==='crenel'){ // 城垛
    poly([[x-1.2*s,y],[x-1.2*s,y-1.5*s],[x+1.2*s,y-1.5*s],[x+1.2*s,y]], c);
    ctx.fillStyle=t;
    for(let i=0;i<4;i++) ctx.fillRect(x-1.15*s+i*0.62*s, y-1.72*s, 0.34*s, 0.25*s);
  } else if(motif==='lotus'){ // 荷叶丛
    ctx.fillStyle=c; ctx.fillRect(x-1.2*s, y-0.9*s, 2.4*s, 0.9*s);
    disc(x-0.5*s, y-1.0*s, 0.4*s, t); disc(x+0.45*s, y-1.05*s, 0.45*s, t);
    ctx.strokeStyle=a; ctx.lineWidth=Math.max(1,s*0.02);
    ctx.beginPath(); ctx.arc(x-0.5*s, y-1.0*s, 0.22*s, 0, TAU); ctx.stroke();
    petalFlower(x+0.45*s, y-1.5*s, 0.22*s, '#d98ba0');
  } else if(motif==='steps'){ // 雪松
    ctx.fillStyle=c; ctx.fillRect(x-0.08*s, y-0.5*s, 0.16*s, 0.5*s);
    poly([[x,y-2.4*s],[x-0.8*s,y-1.3*s],[x+0.8*s,y-1.3*s]], t);
    poly([[x,y-1.9*s],[x-0.95*s,y-0.7*s],[x+0.95*s,y-0.7*s]], t);
  } else if(motif==='lantern'){ // 灯笼杆
    ctx.strokeStyle=t; ctx.lineWidth=Math.max(1.5,s*0.03);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y-2.4*s); ctx.lineTo(x+m*0.7*s, y-2.4*s); ctx.stroke();
    disc(x+m*0.55*s, y-2.05*s, 0.3*s, '#e2483d');
    ctx.fillStyle='rgba(240,182,76,0.35)';
    ctx.beginPath(); ctx.arc(x+m*0.55*s, y-2.05*s, 0.48*s, 0, TAU); ctx.fill();
    poly([[x+m*0.48*s,y-1.75*s],[x+m*0.62*s,y-1.75*s],[x+m*0.55*s,y-1.5*s]], a);
  } else { // 松树
    ctx.fillStyle=c; ctx.fillRect(x-0.09*s, y-0.6*s, 0.18*s, 0.6*s);
    poly([[x,y-2.6*s],[x-0.7*s,y-1.6*s],[x+0.7*s,y-1.6*s]], t);
    poly([[x,y-2.0*s],[x-0.9*s,y-0.9*s],[x+0.9*s,y-0.9*s]], t);
    poly([[x,y-1.4*s],[x-1.05*s,y-0.4*s],[x+1.05*s,y-0.4*s]], t);
  }
}

/* 远景天际线剪影(含紫峰大厦) */
function drawSkyline(lv, dist){
  const base = HOR + 2;
  const off = (dist*4) % 240;
  ctx.fillStyle = lv.sideTop;
  ctx.globalAlpha = 0.55;
  for(let i=-1;i<6;i++){
    const bx = i*240 - off;
    const h1 = 30 + ((i*73)%50+50)%50, h2 = 20 + ((i*41)%40+40)%40;
    ctx.fillRect(bx, base-h1, 60, h1);
    ctx.fillRect(bx+70, base-h2, 45, h2);
    // 紫峰塔剪影:尖顶高楼
    poly([[bx+140,base],[bx+140,base-55],[bx+155,base-88],[bx+170,base-55],[bx+170,base]], lv.sideTop);
  }
  ctx.globalAlpha = 1;
}

/* ================= 剪纸绘制:玩家(背影小人) ================= */
function drawPlayer(pl, t){
  const p = proj(pl.x, pl.y, ZP);
  const s = p.s * 0.62;                 // 角色整体缩放
  const x = p.x, y = p.y;
  const RED = '#c8342e', GOLD = '#f0b64c', DARK = '#1a1220';
  const run = Math.sin(t*14);
  ctx.save();
  ctx.translate(x, y);
  if(pl.sliding){ // 滑铲:身体放平
    ctx.rotate(-0.08);
    ctx.fillStyle = RED;
    ctx.beginPath(); ctx.ellipse(0, -0.35*s, 0.75*s, 0.32*s, 0, 0, TAU); ctx.fill();
    disc(0.62*s, -0.62*s, 0.26*s, RED);            // 头
    disc(0.62*s, -0.88*s, 0.1*s, DARK);            // 发髻
    poly([[0.7*s,-0.5*s],[1.15*s,-0.42*s],[0.75*s,-0.34*s]], GOLD); // 飘带
    ctx.strokeStyle=GOLD; ctx.lineWidth=Math.max(1.5,s*0.03);
    ctx.beginPath(); ctx.ellipse(0, -0.35*s, 0.75*s, 0.32*s, 0, 0, TAU); ctx.stroke();
  } else {
    const airK = pl.y > 0.05 ? 0.4 : 1; // 空中收腿
    // 腿
    ctx.strokeStyle = RED; ctx.lineCap='round'; ctx.lineWidth = 0.2*s;
    const l1 = run*0.5*airK, l2 = -run*0.5*airK;
    ctx.beginPath(); ctx.moveTo(0,-0.95*s); ctx.lineTo(l1*s, -0.45*s); ctx.lineTo(l1*s*1.5, -0.02*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-0.95*s); ctx.lineTo(l2*s, -0.45*s); ctx.lineTo(l2*s*1.5, -0.02*s); ctx.stroke();
    // 身体(剪纸长衫)
    poly([[-0.34*s,-0.9*s],[0.34*s,-0.9*s],[0.26*s,-1.85*s],[-0.26*s,-1.85*s]], RED, GOLD, Math.max(1.5,s*0.025));
    // 手臂
    ctx.strokeStyle = RED; ctx.lineWidth = 0.16*s;
    ctx.beginPath(); ctx.moveTo(-0.22*s,-1.7*s); ctx.lineTo((-0.5-run*0.25)*s, -1.2*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0.22*s,-1.7*s); ctx.lineTo((0.5+run*0.25)*s, -1.2*s); ctx.stroke();
    // 头与发髻(背影)
    disc(0, -2.12*s, 0.3*s, RED);
    disc(0, -2.44*s, 0.12*s, DARK);
    // 腰间金带
    ctx.strokeStyle=GOLD; ctx.lineWidth=Math.max(1.5,s*0.04);
    ctx.beginPath(); ctx.moveTo(-0.3*s,-1.05*s); ctx.lineTo(0.3*s,-1.05*s); ctx.stroke();
    // 飘带
    const fl = Math.sin(t*10)*0.12;
    poly([[-0.1*s,-1.15*s],[-0.55*s,(-1.3+fl)*s],[-0.2*s,-1.35*s]], GOLD);
  }
  ctx.restore();
}

/* ================= 游戏状态 ================= */
const G = {
  state:'menu',      // menu | levels | play | over | clear | album
  mode:'adv',        // adv | endless
  lvIdx:0, paused:false, t:0,
  dist:0, speed:0, items:0, newIds:[],
  obs:[], cols:[], parts:[],
  nextSpawn:0, shake:0,
  buttons:[], albumFrom:'menu',
};
const pl = { lane:0, x:0, y:0, vy:0, sliding:0, jumps:0 };

function startRun(mode, lvIdx){
  G.mode = mode; G.lvIdx = lvIdx;
  G.dist = 0; G.items = 0; G.newIds = []; G.t = 0;
  G.obs = []; G.cols = []; G.parts = [];
  G.speed = mode==='adv' ? LEVELS[lvIdx].speed : 9.5;
  G.nextSpawn = 40; G.paused = false; G.shake = 0;
  pl.lane = 0; pl.x = 0; pl.y = 0; pl.vy = 0; pl.sliding = 0; pl.jumps = 0;
  G.state = 'play';
}
const curLv = ()=> G.mode==='adv' ? LEVELS[G.lvIdx] : LEVELS[Math.floor(G.dist/600)%5];

/* ---- 操作回调 ---- */
function onLeft(){ if(G.state==='play'&&!G.paused){ if(pl.lane>-1){ pl.lane--; sfx.lane(); } } }
function onRight(){ if(G.state==='play'&&!G.paused){ if(pl.lane<1){ pl.lane++; sfx.lane(); } } }
function onJump(){
  if(G.state!=='play'||G.paused) return;
  if(pl.y<=0.01){ pl.vy = 6.4; pl.jumps = 1; sfx.jump(); }
  else if(pl.jumps===1){ pl.vy = 5.6; pl.jumps = 2; sfx.jump(); }
  pl.sliding = 0;
}
function onSlide(){
  if(G.state!=='play'||G.paused) return;
  if(pl.y>0.01){ pl.vy = Math.min(pl.vy, -7); } // 空中快降
  pl.sliding = 0.75; sfx.slide();
}
function onPauseKey(){
  if(G.state==='play'){ G.paused = !G.paused; sfx.click(); }
  else if(G.state==='album'){ G.state = G.albumFrom; sfx.click(); }
  else if(G.state==='levels'){ G.state='menu'; sfx.click(); }
}
function onEnter(){
  if(G.state==='over'){ startRun(G.mode, G.lvIdx); }
  else if(G.state==='clear'){ nextAfterClear(); }
}

/* ---- 生成器:障碍簇 + 收集品引导线 ---- */
function spawnCluster(z){
  const lv = curLv();
  const diff = G.mode==='endless' ? clamp(G.dist/2500,0,1) : 0.25 + G.lvIdx*0.15;
  const lanes = [-1,0,1].sort(()=>Math.random()-0.5);
  const nBlock = Math.random() < 0.35 + diff*0.45 ? 2 : 1; // 堵 1~2 条道
  const freeLane = lanes[nBlock];                          // 必定留出的道
  for(let i=0;i<nBlock;i++){
    const r = Math.random(); const w = lv.weight;
    const type = r < w.low ? 'low' : r < w.low + w.high ? 'high' : 'full';
    G.obs.push({ lane:lanes[i], x:lanes[i]*LANEGAP, z, type });
    // 难度高时同簇追加前后错位障碍
    if(diff > 0.5 && Math.random() < 0.3){
      const l2 = irnd(-1,1);
      if(l2 !== lanes[i]) G.obs.push({ lane:l2, x:l2*LANEGAP, z:z+rnd(6,9), type: Math.random()<0.5?'low':'high' });
    }
  }
  // 收集品弧线:免费道上 4~6 个,若相邻道有 low 障碍则从其上方越过
  const itemId = ITEMS[irnd(0,ITEMS.length-1)].id;
  const n = irnd(4,6), overLow = G.obs.some(o=>o.z===z && o.type==='low' && Math.abs(o.lane-freeLane)===1);
  for(let i=0;i<n;i++){
    const hump = overLow ? Math.sin((i+1)/(n+1)*Math.PI)*1.35 : 0;
    G.cols.push({ x:freeLane*LANEGAP, z:z-2+i*1.8, y:0.55+hump, id:itemId, got:false });
  }
}

/* ---- 粒子 ---- */
function burst(x, y, color){
  for(let i=0;i<10;i++) G.parts.push({
    x, y, z:ZP, vx:rnd(-2,2), vy:rnd(1,4), life:rnd(0.4,0.8), color, size:rnd(2,5),
  });
}
function ambient(lv){
  // 梅花瓣/灯火/星尘 环境粒子
  if(Math.random() > 0.25) return;
  const colors = { crenel:'#e8b04b', lotus:'#d98ba0', steps:'#ffffff', lantern:'#f0b64c', pine:'#c9a2ff' };
  G.parts.push({
    x:rnd(-6,6), y:rnd(2,5), z:rnd(4,30), vx:rnd(-0.5,0.1), vy:rnd(-0.8,-0.3),
    life:rnd(2,4), color:colors[lv.motif]||'#fff', size:rnd(1.5,3.5), ambient:true,
  });
}

/* ---- 主更新 ---- */
function update(dt){
  G.t += dt;
  if(G.state!=='play' || G.paused) return;
  const lv = curLv();
  if(G.mode==='endless') G.speed = Math.min(20, 9.5 + G.dist/280);
  G.dist += G.speed * dt;
  G.shake = Math.max(0, G.shake - dt*3);

  // 生成
  while(G.nextSpawn < G.dist + DRAWD){
    spawnCluster(G.nextSpawn);
    G.nextSpawn += rnd(16,24) * (9.5/G.speed) + 4;
  }
  // 玩家物理
  pl.x = lerp(pl.x, pl.lane*LANEGAP, Math.min(1, dt*12));
  pl.vy -= 18*dt; pl.y += pl.vy*dt;
  if(pl.y<=0){ pl.y=0; pl.vy=0; pl.jumps=0; }
  pl.sliding = Math.max(0, pl.sliding - dt);

  // 障碍:更新相对深度 + 碰撞
  for(const o of G.obs){
    o.rz = o.z - G.dist + ZP;
    if(o.hit) continue;
    if(o.rz > ZP-0.45 && o.rz < ZP+0.45 && Math.abs(o.x - pl.x) < 0.55){
      const jumpClear = pl.y > 0.72;              // 跳起可通过 low
      const slideClear = pl.sliding > 0;          // 滑铲可通过 high
      const dead = o.type==='full' || (o.type==='low' && !jumpClear) || (o.type==='high' && !slideClear);
      if(dead){ o.hit = true; gameOver(); return; }
    }
  }
  G.obs = G.obs.filter(o=>o.rz > 1.2);
  // 收集品
  for(const c of G.cols){
    c.rz = c.z - G.dist + ZP;
    if(!c.got && c.rz > ZP-0.5 && c.rz < ZP+0.5 && Math.abs(c.x-pl.x)<0.6 && Math.abs(c.y-(pl.y+0.8))<0.95){
      c.got = true; G.items++; sfx.collect();
      const p = proj(c.x, c.y, ZP); burst(p.x, p.y, '#f0b64c');
      if(!save.album[c.id]){ save.album[c.id]=true; G.newIds.push(c.id); persist(); }
    }
  }
  G.cols = G.cols.filter(c=>!c.got && c.rz > 1.2);
  // 粒子
  ambient(lv);
  for(const p of G.parts){
    p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt;
    if(!p.ambient) p.vy -= 6*dt;
  }
  G.parts = G.parts.filter(p=>p.life>0);
  // 过关
  if(G.mode==='adv' && G.dist >= lv.len) levelClear();
}

function gameOver(){
  sfx.hit(); G.shake = 1;
  if(G.mode==='endless'){
    const m = Math.floor(G.dist);
    if(m > save.best){ save.best = m; persist(); }
  }
  G.state = 'over';
}
function levelClear(){
  sfx.clear();
  const need = [8,14,20]; let star = 0;
  for(let i=0;i<3;i++) if(G.items>=need[i]) star = i+1;
  if(star > save.stars[G.lvIdx]){ save.stars[G.lvIdx]=star; persist(); }
  else persist();
  G.state = 'clear';
}
function nextAfterClear(){
  if(G.lvIdx < 4) startRun('adv', G.lvIdx+1);
  else G.state = 'menu';
}

/* ================= 渲染:场景 ================= */
function render(){
  const lv = G.state==='play'||G.state==='over'||G.state==='clear' ? curLv() : LEVELS[3]; // 菜单用秦淮夜景
  // 天空
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, lv.sky[0]); g.addColorStop(0.62, lv.sky[1]); g.addColorStop(0.62, lv.ground); g.addColorStop(1, lv.side);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // 月亮/太阳剪纸圆盘
  const moonX = W*0.78, moonY = H*0.16;
  ctx.fillStyle = lv.motif==='lantern' ? '#e2483d' : '#f3e2b0';
  ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(moonX, moonY, 34, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.18; ctx.beginPath(); ctx.arc(moonX, moonY, 52, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  drawSkyline(lv, G.dist);

  // 地面道路(梯形)
  const pN = proj(-ROAD_HALF, 0, 2.2), pN2 = proj(ROAD_HALF, 0, 2.2);
  const pF = proj(-ROAD_HALF, 0, DRAWD), pF2 = proj(ROAD_HALF, 0, DRAWD);
  poly([[pF.x,pF.y],[pF2.x,pF2.y],[pN2.x,Math.min(pN.y,H+40)],[pN.x,Math.min(pN.y,H+40)]], lv.road);
  // 车道分隔线
  for(const lx of [-LANEGAP/2, LANEGAP/2]){
    const a = proj(lx,0,2.2), b = proj(lx,0,DRAWD);
    ctx.strokeStyle = lv.lane; ctx.globalAlpha = 0.5; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.globalAlpha = 1;
  }
  // 横向条纹(前进感)
  const step = 3, z0 = Math.floor((G.dist - ZP)/step)*step + step;
  for(let z = z0; z < G.dist - ZP + DRAWD; z += step){
    const rz = z - G.dist + ZP; if(rz < 2.2) continue;
    const a = proj(-ROAD_HALF, 0, rz), b = proj(ROAD_HALF, 0, rz);
    ctx.strokeStyle = lv.lane; ctx.globalAlpha = clamp(0.35*(1-rz/DRAWD), 0, 0.35);
    ctx.lineWidth = Math.max(1, a.s*0.03);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // 两侧走廊装饰(远->近)
  const sstep = 5, sz0 = Math.floor((G.dist - ZP)/sstep)*sstep + sstep;
  for(let z = sz0; z < G.dist - ZP + DRAWD; z += sstep){
    const rz = z - G.dist + ZP; if(rz < 2.4) continue;
    for(const m of [-1,1]){
      const px = m * (ROAD_HALF + 1.3);
      const p = proj(px, 0, rz);
      drawSide(lv.motif, p.x, p.y, p.s, lv, m<0);
    }
  }
  // 中山陵:远处祭堂剪影
  if(lv.motif==='steps'){
    const p = proj(0, 0, DRAWD*0.96);
    poly([[p.x-30,p.y],[p.x-30,p.y-26],[p.x,p.y-40],[p.x+30,p.y-26],[p.x+30,p.y]], '#5a7ca6');
  }
  // 收集品(远->近)
  const cols = G.cols.slice().sort((a,b)=>b.rz-a.rz);
  for(const c of cols){
    if(c.rz < 2 || c.rz > DRAWD) continue;
    const p = proj(c.x, c.y + Math.sin(G.t*3+c.z)*0.08, c.rz);
    drawItemIcon(c.id, p.x, p.y, clamp(p.s*0.32, 3, 26), false);
  }
  // 障碍(远->近)
  const obs = G.obs.slice().sort((a,b)=>b.rz-a.rz);
  for(const o of obs){ if(o.rz > 2 && o.rz < DRAWD) drawObstacle(o, lv); }
  // 玩家
  if(G.state==='play') drawPlayer(pl, G.t);
  // 粒子
  for(const pt of G.parts){
    const p = proj(pt.x, pt.y, pt.z);
    ctx.globalAlpha = clamp(pt.life, 0, 1) * (pt.ambient?0.7:1);
    disc(p.x, p.y, pt.size*(pt.ambient?p.s*0.02+0.6:1), pt.color);
  }
  ctx.globalAlpha = 1;
}

/* ================= 渲染:UI 组件 ================= */
function text(str, x, y, size, color, align, weight){
  ctx.font = (weight ? weight + ' ' : '') + size + 'px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.textAlign = align||'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function button(id, label, x, y, w, h, opts){
  opts = opts||{};
  G.buttons.push({ id, x:x-w/2, y:y-h/2, w, h, data:opts.data });
  ctx.globalAlpha = opts.disabled ? 0.45 : 1;
  const bg = opts.bg || '#c8342e';
  poly([[x-w/2+8,y-h/2],[x+w/2-8,y-h/2],[x+w/2,y],[x+w/2-8,y+h/2],[x-w/2+8,y+h/2],[x-w/2,y]], bg);
  ctx.strokeStyle = '#f0b64c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x-w/2+8,y-h/2); ctx.lineTo(x+w/2-8,y-h/2); ctx.lineTo(x+w/2,y);
  ctx.lineTo(x+w/2-8,y+h/2); ctx.lineTo(x-w/2+8,y+h/2); ctx.lineTo(x-w/2,y); ctx.closePath(); ctx.stroke();
  text(label, x, y+1, opts.size||22, '#f7ead0', 'center', 'bold');
  ctx.globalAlpha = 1;
}
function stars(n, x, y, r){
  for(let i=0;i<3;i++){
    const cx = x + (i-1)*r*2.6, on = i < n;
    ctx.fillStyle = on ? '#f0b64c' : 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    for(let k=0;k<10;k++){
      const a = -Math.PI/2 + k*Math.PI/5, rr = k%2 ? r*0.45 : r;
      ctx[k?'lineTo':'moveTo'](cx+Math.cos(a)*rr, y+Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fill();
  }
}
function dim(alpha){ ctx.fillStyle=`rgba(8,6,14,${alpha})`; ctx.fillRect(0,0,W,H); }

/* ---- HUD ---- */
function drawHUD(){
  const lv = curLv();
  text(Math.floor(G.dist)+' m', 24, 30, 24, lv.hud, 'left', 'bold');
  drawItemIcon('plum', 34, 66, 11, false);
  text('× '+G.items, 52, 66, 20, lv.hud, 'left', 'bold');
  if(G.mode==='adv'){
    text(lv.name, CX, 30, 22, lv.hud, 'center', 'bold');
    // 进度条
    const pw = 260, px = CX-pw/2, py = 48;
    ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(px, py, pw, 6);
    ctx.fillStyle=lv.accent; ctx.fillRect(px, py, pw*clamp(G.dist/lv.len,0,1), 6);
  } else {
    text('无尽模式 · 最佳 '+save.best+' m', CX, 30, 20, lv.hud, 'center', 'bold');
  }
  text('←→换道  ↑跳  ↓滑铲  P暂停  M静音'+(save.muted?'(已静音)':''), CX, H-16, 13, lv.hud, 'center');
  if(G.paused){
    dim(0.6);
    text('暂 停', CX, H*0.42, 54, '#f7ead0', 'center', 'bold');
    button('resume','继续', CX, H*0.56, 180, 52);
    button('quit','回主菜单', CX, H*0.68, 180, 52, {bg:'#5a4a6b'});
  }
}

/* ---- 界面 ---- */
function drawMenu(){
  dim(0.25);
  // 标题剪纸章
  text('金陵快跑', CX, H*0.26, 78, '#f7ead0', 'center', 'bold');
  ctx.strokeStyle='#f0b64c'; ctx.lineWidth=3;
  ctx.strokeRect(CX-190, H*0.26-52, 380, 104);
  text('—— 奔跑展开的金陵长卷 ——', CX, H*0.38, 18, '#f0b64c');
  petalFlower(CX-230, H*0.26, 16, '#e2483d'); petalFlower(CX+230, H*0.26, 16, '#e2483d');

function drawLevels(){
  dim(0.55);
  text('选择关卡', CX, 70, 40, '#f7ead0', 'center', 'bold');
  for(let i=0;i<5;i++){
    const x = CX + (i-2)*180, y = H*0.48, unlocked = i===0 || save.stars[i-1] > 0;
    const lv = LEVELS[i];
    ctx.globalAlpha = unlocked?1:0.45;
    poly([[x-78,y-100],[x+78,y-100],[x+88,y],[x+78,y+110],[x-78,y+110],[x-88,y]], lv.ground);
    ctx.strokeStyle = lv.accent; ctx.lineWidth=2; ctx.stroke();
    text((i+1)+'', x, y-74, 30, lv.hud, 'center', 'bold');
    text(lv.name, x, y-38, 19, lv.hud, 'center', 'bold');
    // 该关小图标
    const p = {s:26};
    drawSide(lv.motif, x, y+52, p.s, lv, false);
    if(unlocked){ stars(save.stars[i], x, y+86, 11); G.buttons.push({id:'lv', x:x-88, y:y-100, w:176, h:210, data:i}); }
    else text('🔒 通关前一关解锁', x, y+86, 12, '#cbb');
    ctx.globalAlpha = 1;
  }
  button('back','返回', CX, H-56, 140, 44, {bg:'#5a4a6b'});
}
function drawOver(){
  dim(0.55);
  const got = G.newIds.length;
  text('撞上了!', CX, H*0.3, 52, '#f7ead0', 'center', 'bold');
  const line = G.mode==='endless'
    ? '跑了 '+Math.floor(G.dist)+' m · 收集 '+G.items+(Math.floor(G.dist)>=save.best?' · 新纪录!':'')
    : LEVELS[G.lvIdx].name+' · 跑了 '+Math.floor(G.dist)+' m · 收集 '+G.items;
  text(line, CX, H*0.4, 20, '#f0b64c');
  if(got) text('新图鉴:'+G.newIds.map(id=>ITEMS.find(i=>i.id===id).name).join('、'), CX, H*0.46, 16, '#a8d5a2');
  button('retry','再来一次 (Enter)', CX, H*0.58, 240, 52);
  button('quit','回主菜单', CX, H*0.7, 240, 52, {bg:'#5a4a6b'});
}
function drawClear(){
  dim(0.5);
  text('过关!', CX, H*0.24, 56, '#f7ead0', 'center', 'bold');
  text(LEVELS[G.lvIdx].name+' · 收集 '+G.items+' 件金陵风物', CX, H*0.33, 20, '#f0b64c');
  stars(save.stars[G.lvIdx], CX, H*0.44, 20);
  if(G.newIds.length) text('新图鉴:'+G.newIds.map(id=>ITEMS.find(i=>i.id===id).name).join('、'), CX, H*0.53, 16, '#a8d5a2');
  if(G.lvIdx<4) button('next','下一关:'+LEVELS[G.lvIdx+1].name+' (Enter)', CX, H*0.64, 300, 52);
  else text('你已跑遍金陵五景!图鉴还在继续等你集齐', CX, H*0.64, 18, '#f7ead0');
  button('quit','回主菜单', CX, H*0.76, 240, 52, {bg:'#5a4a6b'});
}
function drawAlbum(){
  dim(0.82);
  text('金陵图鉴', CX, 56, 40, '#f7ead0', 'center', 'bold');
  text('跑酷途中收集的风物,点亮即永久收录', CX, 92, 15, '#f0b64c');
  for(let i=0;i<ITEMS.length;i++){
    const it = ITEMS[i], got = !!save.album[it.id];
    const x = CX + (i%3-1)*260, y = 190 + Math.floor(i/3)*160;
    ctx.globalAlpha = got?1:0.6;
    disc(x, y-24, 40, got?'rgba(200,52,46,0.25)':'rgba(255,255,255,0.06)', got?'#f0b64c':'#555', 2);
    drawItemIcon(it.id, x, y-24, 26, !got);
    text(got?it.name:'???', x, y+30, 20, got?'#f7ead0':'#776e85', 'center', 'bold');
    text(got?it.note:'还未收集到…', x, y+56, 12, got?'#d8c9a8':'#5a5366');
    ctx.globalAlpha = 1;
  }
  button('back','返回 (Esc)', CX, H-48, 180, 44, {bg:'#5a4a6b'});
}

/* ---- 点击 ---- */
function clickAt(px, py){
  for(const b of G.buttons){
    if(px>=b.x && px<=b.x+b.w && py>=b.y && py<=b.y+b.h){
      sfx.click(); handleButton(b.id, b.data); return;
    }
  }
}
function handleButton(id, data){
  if(id==='adv') G.state='levels';
  else if(id==='endless') startRun('endless', 0);
  else if(id==='album'){ G.albumFrom = G.state==='play'?'play':'menu'; G.state='album'; }
  else if(id==='lv') startRun('adv', data);
  else if(id==='back') G.state = G.state==='album' ? G.albumFrom : 'menu';
  else if(id==='retry') startRun(G.mode, G.lvIdx);
  else if(id==='quit'){ G.paused=false; G.state='menu'; }
  else if(id==='resume') G.paused=false;
  else if(id==='next') nextAfterClear();
}

/* ================= 主循环 ================= */
let lastT = 0;
function frame(ts){
  const dt = Math.min(0.05, (ts-lastT)/1000 || 0.016); lastT = ts;
  update(dt);
  G.buttons = [];
  ctx.save();
  if(G.shake>0) ctx.translate(rnd(-1,1)*G.shake*8, rnd(-1,1)*G.shake*8);
  render();
  ctx.restore();
  if(G.state==='play') drawHUD();
  else if(G.state==='menu') drawMenu();
  else if(G.state==='levels') drawLevels();
  else if(G.state==='over') drawOver();
  else if(G.state==='clear') drawClear();
  else if(G.state==='album') drawAlbum();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 深链直达:#lv0~#lv4 直接开对应关,#play 直接无尽模式(便于分享/测试)
if(location.hash==='#play') startRun('endless', 0);
else if(/^#lv[0-4]$/.test(location.hash)) startRun('adv', +location.hash.slice(3));
</script>
