<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>冲鸭！金陵！· 南京城市跑酷</title>
<meta name="description" content="南京城市主题跑酷 H5:白胖鸭跑遍金陵十景,收集 40 件风物图鉴。没有一只鸭子能走出南京——除了我。">
<meta name="theme-color" content="#0d0a14">
<meta name="duckduckrun-build" content="__BUILD_ID__">
<!-- __SOCIAL_META__ -->
<link rel="icon" href="./assets/icons/duck-512.png">
<link rel="apple-touch-icon" href="./assets/icons/duck-192.png">
<style>
  /* 三档字体:铭心毛笔(书法大标题,马善政毛笔楷书 OFL)/文楷(≥14px 正文,霞鹜文楷 OFL)/黑体(小字与数据,系统) */
  @font-face{
    font-family:'JinlingBrush';
    src:url('./assets/fonts/jinling-brush.woff2') format('woff2');
    font-display:swap;
  }
  @font-face{
    font-family:'JinlingKai';
    src:url('./assets/fonts/jinling-kai.woff2') format('woff2');
    font-display:swap;
  }
  :root{color-scheme:dark}
  html,body{margin:0;padding:0;background:#0d0a14;height:100%;overflow:hidden;overscroll-behavior:none;
    font-family:"JinlingKai","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}
  #wrap{position:fixed;inset:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
    padding-top:max(0px,env(safe-area-inset-top));padding-right:max(0px,env(safe-area-inset-right));
    padding-bottom:max(0px,env(safe-area-inset-bottom));padding-left:max(0px,env(safe-area-inset-left))}
  canvas{display:block;touch-action:none;cursor:pointer;box-shadow:0 0 60px rgba(0,0,0,.6);outline:none}
  canvas:focus-visible{outline:3px solid #f0b64c;outline-offset:4px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  /* 竖屏引导层:触屏设备纵向拿手机时全屏提示旋转 */
  #rotate{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:#1b2a44;color:#f4f1e8;font-family:"JinlingKai","KaiTi","Microsoft YaHei","PingFang SC",serif;gap:22px;
    padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));box-sizing:border-box}
  #rotate .phone{width:56px;height:96px;border:3px solid #f0b64c;border-radius:10px;position:relative;animation:rot 1.6s ease-in-out infinite}
  #rotate .phone::after{content:'';position:absolute;left:50%;top:50%;width:3px;height:26px;background:#f0b64c;transform:translate(-50%,-50%)}
  @keyframes rot{0%,100%{transform:rotate(0)}40%{transform:rotate(90deg)}60%{transform:rotate(90deg)}}
  #rotate .t1{font-size:26px;letter-spacing:4px;text-align:center}
  #rotate .t2{font-size:14px;color:rgba(244,241,232,0.55);text-align:center}
  /* 分享遮罩:微信/老 iOS 内把成绩卡渲染成 img,提示长按保存;附复制链接按钮 */
  #shareLayer{position:fixed;inset:0;z-index:98;background:rgba(10,8,16,0.93);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow-y:auto;
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-sizing:border-box;
    font-family:"JinlingKai","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
  #shareLayer .card{height:min(56vh,340px);width:auto;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  #shareLayer .tip{color:rgba(246,241,231,0.75);font-size:14px;margin:0;text-align:center}
  #shareLayer button,#appError button{background:#d85c47;color:#f7f2e6;border:none;border-radius:22px;
    padding:11px 40px;font-size:16px;cursor:pointer;flex-shrink:0}
  #shareLayer button:focus-visible,#appError button:focus-visible{outline:3px solid #f0b64c;outline-offset:3px}
  #shareLayer .ghost{background:transparent;border:1.5px solid rgba(246,241,231,0.35);color:rgba(246,241,231,0.8)}
  #shareToast{position:fixed;left:50%;bottom:12vh;transform:translateX(-50%);z-index:99;
    background:#f0b64c;color:#1a1424;padding:10px 18px;border-radius:20px;font-size:14px;
    opacity:0;transition:opacity .3s;pointer-events:none;max-width:80vw}
  #canvasRecovery,#appError{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;box-sizing:border-box;background:rgba(13,10,20,.96);color:#f7f2e6;text-align:center}
  #canvasRecovery p,#appError p{max-width:30rem;line-height:1.65;margin:0 0 18px}
  #appError h2{font-family:"JinlingBrush","KaiTi","Microsoft YaHei",serif;font-size:30px;margin:0 0 10px;color:#f0b64c}
  #canvasRecovery[hidden],#appError[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){#rotate .phone{animation:none}#shareToast{transition:none}}
</style>
<link rel="stylesheet" href="./src/mobile.css">
</head>
<body>
<h1 class="sr-only">冲鸭！金陵！南京城市跑酷</h1>
<p id="gameInstructions" class="sr-only">竖屏即可游玩。左右滑换道，上滑跳跃，下滑滑铲。键盘支持方向键、WASD 和空格；P 或 Escape 暂停。菜单使用 Tab 和 Enter。</p>
<div id="wrap"><canvas id="cv" width="960" height="540" tabindex="0" aria-label="冲鸭！金陵！互动游戏画布" aria-describedby="gameInstructions"></canvas></div>
<main id="app-ui"></main>
<div id="shareLayer">
  <img class="card" alt="冲鸭！金陵！成绩卡">
  <div class="tip">长按图片保存 / 发送给好友</div>
  <button id="copyBtn">复制链接发给朋友</button>
  <button class="ghost" id="closeShare">关 闭</button>
</div>
<div id="shareToast" role="status" aria-live="polite"></div>
<div id="canvasRecovery" role="status" aria-live="assertive" hidden><p>图形画面正在恢复，请稍候。</p></div>
<section id="appError" role="alert" aria-labelledby="appErrorTitle" tabindex="-1" hidden>
  <h2 id="appErrorTitle">游戏暂时没有跑起来</h2>
  <p>请刷新页面后重试；若仍然失败，请在系统浏览器中打开链接，并保留当前版本号反馈给我们。</p>
  <button id="reloadApp" type="button">重新打开</button>
</section>
<script>
  (() => {
    const showError = () => {
      const error = document.getElementById('appError');
      const canvas = document.getElementById('cv');
      if(!error) return;
      if(canvas) canvas.setAttribute('aria-hidden','true');
      error.hidden = false;
      error.focus({preventScroll:true});
    };
    window.__duckDuckRunShowError = showError;
    window.addEventListener('error', event => {
      if(event.error || event.filename) showError();
    });
    window.addEventListener('unhandledrejection', () => showError());
    document.getElementById('reloadApp')?.addEventListener('click', () => location.reload());
  })();
</script>
<script src="./asset-manifest.js"></script>
<script id="appEntry" type="module" src="./src/main.js"></script>
<script>document.getElementById('appEntry')?.addEventListener('error', () => window.__duckDuckRunShowError?.());</script>
</body>
</html>
