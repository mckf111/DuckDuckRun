name: quality-gate

on:
  push:
    branches: [manus/duckduckrun-hardening]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/e2e/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tools/e2e
      - run: node tools/e2e/node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run verify
      - name: Upload immutable static artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckduckrun-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
